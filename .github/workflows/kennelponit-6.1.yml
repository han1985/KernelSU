name: KennelPonit-6.1.x

# Same KMI/image as original KernelSU .github/workflows/build-lkm.yml + ddk-lkm.yml:
#   android14-6.1  ->  ghcr.io/ylarod/ddk-min:android14-6.1-20260828
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android14-6.1
    uses: ./.github/workflows/kennelponit-build.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: "20260828"
