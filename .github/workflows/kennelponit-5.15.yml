name: KennelPonit-5.15.x

# Same KMI/image as original KernelSU .github/workflows/build-lkm.yml + ddk-lkm.yml:
#   android13-5.15  ->  ghcr.io/ylarod/ddk-min:android13-5.15-20260828
#   android14-5.15  ->  ghcr.io/ylarod/ddk-min:android14-5.15-20260828
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android13-5.15
          - android14-5.15
    uses: ./.github/workflows/kennelponit-build.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: "20260828"
