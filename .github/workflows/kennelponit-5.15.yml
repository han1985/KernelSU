name: KennelPonit-5.15.x

# Official android13-5.15 monthly GKI small version:
#   5.15.123  ->  android13-5.15-2023-11
# Layout matches local: common/drivers/pointProcmodule
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gki_branch: android13-5.15-2023-11
            kver: "5.15.123"
    uses: ./.github/workflows/kennelponit-gki-build.yml
    secrets: inherit
    with:
      kmi: android13-5.15
      gki_branch: ${{ matrix.gki_branch }}
      ddk_release: "20260828"
