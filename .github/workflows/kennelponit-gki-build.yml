name: KennelPonit GKI monthly build (reusable)

# Build pointProcmodule against an AOSP kernel/common monthly branch
# (real 6.12.x / 6.1.x / 6.6.x patch), using DDK only for Clang.
on:
  workflow_call:
    inputs:
      kmi:
        required: true
        type: string
      gki_branch:
        required: true
        type: string
      ddk_release:
        required: false
        type: string
        default: "20260828"

jobs:
  build:
    name: ${{ inputs.gki_branch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    steps:
      - name: Clone private pointProcmodule
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty on han1985/KernelSU."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            "${GITHUB_WORKSPACE}/pointProcmodule"

      - name: Clone AOSP kernel/common ${{ inputs.gki_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.gki_branch }}" \
            https://android.googlesource.com/kernel/common \
            "${GITHUB_WORKSPACE}/linux"

      - name: Integrate and build pointProcmodule
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          KMI="${{ inputs.kmi }}"
          SRC="${GITHUB_WORKSPACE}/linux"
          DDK_KDIR="/opt/ddk/kdir/${KMI}"
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          if [ -n "${CLANG_PATH:-}" ] && [ ! -x "${CLANG_PATH}" ]; then
            export CLANG_PATH="$(command -v clang)"
          fi

          echo "=== prepare ${{ inputs.gki_branch }} ==="
          make -C "$SRC" ARCH=arm64 LLVM=1 CC=clang gki_defconfig
          scripts_config="$SRC/scripts/config"
          if [ -x "$scripts_config" ]; then
            "$scripts_config" --file "$SRC/.config" \
              -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO \
              -d RUST -d RUST_IS_AVAILABLE || true
            if [ "$KMI" = "android16-6.12" ] || [ "$KMI" = "android17-6.18" ]; then
              "$scripts_config" --file "$SRC/.config" -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS || true
            fi
          fi
          make -C "$SRC" ARCH=arm64 LLVM=1 CC=clang modules_prepare

          # modules_prepare does not generate Module.symvers. Without it modpost
          # treats memcpy/printk/kfree as undefined. Reuse DDK's prebuilt GKI
          # symbol table (same KMI).
          DDK_SYMVERS=""
          if [ -f "$DDK_KDIR/Module.symvers" ]; then
            DDK_SYMVERS="$DDK_KDIR/Module.symvers"
          else
            DDK_SYMVERS=$(find /opt/ddk/kdir -name Module.symvers -print -quit || true)
          fi
          if [ -z "$DDK_SYMVERS" ] || [ ! -f "$DDK_SYMVERS" ]; then
            echo "[ERROR] DDK Module.symvers not found under $DDK_KDIR"
            ls -la "$DDK_KDIR" | head
            exit 1
          fi
          cp "$DDK_SYMVERS" "$SRC/Module.symvers"
          echo "=== using Module.symvers from $DDK_SYMVERS ($(wc -l < "$SRC/Module.symvers") symbols) ==="

          KVER=""
          if [ -f "$SRC/include/config/kernel.release" ]; then
            KVER=$(tr -d ' \n' < "$SRC/include/config/kernel.release")
          elif [ -f "$SRC/include/generated/utsrelease.h" ]; then
            KVER=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$SRC/include/generated/utsrelease.h" | head -n1)
          else
            KVER=$(make -s -C "$SRC" ARCH=arm64 LLVM=1 kernelrelease || true)
          fi
          if [ -z "$KVER" ]; then
            KVER="unknown"
          fi
          KVER_SAFE=$(printf '%s' "$KVER" | tr '/ :' '---')
          echo "=== kernel.release: ${KVER} ==="
          echo "kver=${KVER_SAFE}" >> "$GITHUB_OUTPUT"

          if [ -d "$SRC/common/drivers" ]; then
            DRIVER_DIR="$SRC/common/drivers"
          elif [ -d "$SRC/drivers" ]; then
            DRIVER_DIR="$SRC/drivers"
          else
            echo "[ERROR] drivers/ not found under $SRC"
            ls -la "$SRC" | head
            exit 1
          fi

          DRIVER_MAKEFILE="$DRIVER_DIR/Makefile"
          test -f "$DRIVER_MAKEFILE"
          test -d "$GITHUB_WORKSPACE/pointProcmodule"

          rm -rf "$DRIVER_DIR/pointProcmodule"
          cp -a "$GITHUB_WORKSPACE/pointProcmodule" "$DRIVER_DIR/pointProcmodule"
          rm -rf "$DRIVER_DIR/pointProcmodule/.git"

          sed -i '/obj-\$(CONFIG_KSU)[[:space:]]*+=[[:space:]]*kernelsu\//d' "$DRIVER_MAKEFILE"
          if ! grep -qE 'obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*pointProcmodule/' "$DRIVER_MAKEFILE"; then
            sed -i -e '$a\' "$DRIVER_MAKEFILE"
            echo 'obj-$(CONFIG_KSU) += pointProcmodule/' >> "$DRIVER_MAKEFILE"
          fi

          if [ -f "$DRIVER_DIR/pointProcmodule/Kconfig" ] && [ -f "$DRIVER_DIR/Kconfig" ]; then
            if ! grep -q 'pointProcmodule/Kconfig' "$DRIVER_DIR/Kconfig"; then
              sed -i '/endmenu/i source "drivers/pointProcmodule/Kconfig"' "$DRIVER_DIR/Kconfig" \
                || echo 'source "drivers/pointProcmodule/Kconfig"' >> "$DRIVER_DIR/Kconfig"
            fi
          fi

          echo "=== Building ${KMI} ${{ inputs.gki_branch }} kernel ${KVER} ==="
          make -C "$SRC" ARCH=arm64 LLVM=1 CC=clang \
            M="$DRIVER_DIR/pointProcmodule" \
            KBUILD_EXTRA_SYMBOLS="$SRC/Module.symvers" \
            CONFIG_KSU=m modules

          OUT_DIR="$GITHUB_WORKSPACE/out/aarch64"
          mkdir -p "$OUT_DIR"
          if [ -z "$(find "$DRIVER_DIR/pointProcmodule" -name '*.ko' -print -quit)" ]; then
            echo "[ERROR] no .ko produced"
            exit 1
          fi

          {
            echo "kmi=${KMI}"
            echo "gki_branch=${{ inputs.gki_branch }}"
            echo "kernel.release=${KVER}"
          } > "$OUT_DIR/KERNEL_VERSION.txt"

          find "$DRIVER_DIR/pointProcmodule" -name '*.ko' -print0 |
          while IFS= read -r -d '' ko; do
            base=$(basename "$ko" .ko)
            vermagic=""
            if command -v modinfo >/dev/null 2>&1; then
              vermagic=$(modinfo -F vermagic "$ko" 2>/dev/null || true)
            fi
            if [ -n "$vermagic" ]; then
              echo "vermagic ${base}: ${vermagic}" | tee -a "$OUT_DIR/KERNEL_VERSION.txt"
              ko_kver=$(printf '%s' "$vermagic" | awk '{print $1}')
            else
              ko_kver="$KVER_SAFE"
            fi
            ko_kver_safe=$(printf '%s' "$ko_kver" | tr '/ :' '---')
            dest="$OUT_DIR/${KMI}_${ko_kver_safe}_${base}.ko"
            cp "$ko" "$dest"
            llvm-strip -d "$dest" || true
            echo "Copied $dest $(du -h "$dest" | cut -f1)"
          done
          cat "$OUT_DIR/KERNEL_VERSION.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-${{ inputs.kmi }}_${{ inputs.gki_branch }}_${{ steps.build.outputs.kver }}
          path: out/aarch64/
