name: KennelPonit GKI monthly build (reusable)

# Local layout:
#   com6.12.x/common/drivers/<module>
#   make -C $KERNEL_SRC M=common/drivers/<module> modules
# CI: clone kernel/common into ./common, drop module in common/drivers/pointProcmodule,
# use DDK Module.symvers (same KMI).
on:
  workflow_call:
    inputs:
      kmi:
        required: true
        type: string
      gki_branch:
        required: true
        type: string
      ddk_release:
        required: false
        type: string
        default: "20260828"

jobs:
  build:
    name: ${{ inputs.gki_branch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    steps:
      - name: Clone AOSP kernel/common as ./common
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.gki_branch }}" \
            https://android.googlesource.com/kernel/common \
            "${GITHUB_WORKSPACE}/common"

      - name: Clone pointProcmodule into common/drivers
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty on han1985/KernelSU."
            exit 1
          fi
          MDIR="${GITHUB_WORKSPACE}/common/drivers/pointProcmodule"
          git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            "$MDIR"
          ls -la "$MDIR"

      - name: Build like local make -C common M=common/drivers/pointProcmodule
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          KMI="${{ inputs.kmi }}"
          SRC="${GITHUB_WORKSPACE}/common"
          MDIR="${SRC}/drivers/pointProcmodule"
          DDK_KDIR="/opt/ddk/kdir/${KMI}"
          test -f "$MDIR/Makefile"

          if [ -n "${CLANG_PATH:-}" ] && [ ! -x "${CLANG_PATH}" ]; then
            export CLANG_PATH="$(command -v clang)"
          fi
          export ARCH=arm64
          export LLVM=1
          export CC=clang

          echo "=== prepare ${{ inputs.gki_branch }} ==="
          make -C "$SRC" ARCH=arm64 LLVM=1 CC=clang gki_defconfig
          if [ -x "$SRC/scripts/config" ]; then
            "$SRC/scripts/config" --file "$SRC/.config" \
              -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO \
              -d RUST -d RUST_IS_AVAILABLE \
              -d MODULE_COMPRESS -d MODULE_COMPRESS_ALL \
              -d MODULE_COMPRESS_GZIP -d MODULE_COMPRESS_XZ -d MODULE_COMPRESS_ZSTD \
              -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES || true
            if [ "$KMI" = "android16-6.12" ] || [ "$KMI" = "android17-6.18" ]; then
              "$SRC/scripts/config" --file "$SRC/.config" -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS || true
            fi
          fi
          make -C "$SRC" ARCH=arm64 LLVM=1 CC=clang modules_prepare

          DDK_SYMVERS="$DDK_KDIR/Module.symvers"
          if [ ! -f "$DDK_SYMVERS" ]; then
            DDK_SYMVERS=$(find /opt/ddk/kdir -name Module.symvers -print -quit || true)
          fi
          test -f "$DDK_SYMVERS"
          cp "$DDK_SYMVERS" "$SRC/Module.symvers"
          echo "=== Module.symvers from $DDK_SYMVERS ($(wc -l < "$SRC/Module.symvers") symbols) ==="

          DRIVER_MAKEFILE="$SRC/drivers/Makefile"
          if [ -f "$DRIVER_MAKEFILE" ]; then
            sed -i '/obj-\$(CONFIG_KSU)[[:space:]]*+=[[:space:]]*kernelsu\//d' "$DRIVER_MAKEFILE"
            if ! grep -qE 'pointProcmodule/' "$DRIVER_MAKEFILE"; then
              sed -i -e '$a\' "$DRIVER_MAKEFILE"
              echo 'obj-m += pointProcmodule/' >> "$DRIVER_MAKEFILE"
            fi
          fi

          KVER=""
          if [ -f "$SRC/include/config/kernel.release" ]; then
            KVER=$(tr -d ' \n' < "$SRC/include/config/kernel.release")
          elif [ -f "$SRC/include/generated/utsrelease.h" ]; then
            KVER=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$SRC/include/generated/utsrelease.h" | head -n1)
          else
            KVER=$(make -s -C "$SRC" ARCH=arm64 LLVM=1 kernelrelease || true)
          fi
          if [ -z "$KVER" ]; then
            KVER="unknown"
          fi
          KVER_SAFE=$(printf '%s' "$KVER" | tr '/ :' '---')
          echo "=== kernel.release: ${KVER} ==="
          echo "kver=${KVER_SAFE}" >> "$GITHUB_OUTPUT"

          echo "=== make -C $SRC M=$MDIR modules ==="
          make -C "$SRC" M="$MDIR" ARCH=arm64 LLVM=1 CC=clang modules

          echo "=== module dir ==="
          ls -la "$MDIR"

          OUT_DIR="$GITHUB_WORKSPACE/out/aarch64"
          mkdir -p "$OUT_DIR"
          {
            echo "kmi=${KMI}"
            echo "gki_branch=${{ inputs.gki_branch }}"
            echo "kernel.release=${KVER}"
          } > "$OUT_DIR/KERNEL_VERSION.txt"

          found=0
          while IFS= read -r -d '' ko; do
            found=1
            case "$ko" in
              *.ko.gz) gzip -dc "$ko" > "${ko%.gz}"; ko="${ko%.gz}" ;;
              *.ko.xz) xz -dc "$ko" > "${ko%.xz}"; ko="${ko%.xz}" ;;
              *.ko.zst) zstd -dc "$ko" > "${ko%.zst}"; ko="${ko%.zst}" ;;
            esac
            base=$(basename "$ko" .ko)
            vermagic=""
            if command -v modinfo >/dev/null 2>&1; then
              vermagic=$(modinfo -F vermagic "$ko" 2>/dev/null || true)
            fi
            if [ -n "$vermagic" ]; then
              echo "vermagic ${base}: ${vermagic}" | tee -a "$OUT_DIR/KERNEL_VERSION.txt"
              ko_kver=$(printf '%s' "$vermagic" | awk '{print $1}')
            else
              ko_kver="$KVER_SAFE"
            fi
            ko_kver_safe=$(printf '%s' "$ko_kver" | tr '/ :' '---')
            dest="$OUT_DIR/${KMI}_${ko_kver_safe}_${base}.ko"
            dest_strip="$OUT_DIR/${KMI}_${ko_kver_safe}_${base}.stripped.ko"
            cp "$ko" "$dest"
            cp "$ko" "$dest_strip"
            llvm-strip -d "$dest_strip" || true
            echo "Copied unstripped $dest $(du -h "$dest" | cut -f1)"
            echo "Copied stripped   $dest_strip $(du -h "$dest_strip" | cut -f1)"
          done < <(find "$MDIR" -type f \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "[ERROR] no .ko produced"
            find "$MDIR" -maxdepth 2 -type f | head -80
            exit 1
          fi
          cat "$OUT_DIR/KERNEL_VERSION.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-${{ inputs.kmi }}_${{ inputs.gki_branch }}_${{ steps.build.outputs.kver }}
          path: out/aarch64/
