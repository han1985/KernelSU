name: KennelPonit-5.10.x

# Official android12-5.10 monthly GKI small version:
#   5.10.81  ->  android12-5.10-2022-03
# Layout matches local: common/drivers/pointProcmodule
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gki_branch: android12-5.10-2022-03
            kver: "5.10.81"
    uses: ./.github/workflows/kennelponit-gki-build.yml
    secrets: inherit
    with:
      kmi: android12-5.10
      gki_branch: ${{ matrix.gki_branch }}
      ddk_release: "20260828"
