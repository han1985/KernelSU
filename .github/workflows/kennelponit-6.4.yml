name: KennelPonit-6.4.x

# Android GKI / ylarod DDK has no 6.4.x image (GKI jumped 6.1 -> 6.6).
# Manual only. This workflow records that gap instead of pulling a fake image.
on:
  workflow_dispatch:

jobs:
  unavailable:
    name: no DDK 6.4.x
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "KennelPonit-6.4.x: DDK/GKI has no android*-6.4 image."
          echo "Available nearby: KennelPonit-6.1.x (android14-6.1), KennelPonit-6.6.x (android15-6.6)."
          exit 1
