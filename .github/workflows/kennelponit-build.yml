name: KennelPonit build (reusable)

# Matches local AOSP/Kleaf flow:
#   module lives at common/drivers/<name>
#   Makefile is obj-m += qcomdc.o
#   make -C $KERNEL_SRC M=$M modules
# DDK kdir is the prebuilt KERNEL_SRC (same role as bazel //common:kernel_aarch64).
on:
  workflow_call:
    inputs:
      kmi:
        required: true
        type: string
      ddk_release:
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.kmi }}-${{ inputs.ddk_release }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    steps:
      - name: Clone private pointProcmodule into common/drivers
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty on han1985/KernelSU."
            exit 1
          fi
          MDIR="${GITHUB_WORKSPACE}/common/drivers/pointProcmodule"
          mkdir -p "$(dirname "$MDIR")"
          git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            "$MDIR"
          ls -la "$MDIR"

      - name: Build like local make -C KERNEL_SRC M=common/drivers/...
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          KMI="${{ inputs.kmi }}"
          KDIR="/opt/ddk/kdir/${KMI}"
          SRC="/opt/ddk/src/${KMI}"
          MDIR="${GITHUB_WORKSPACE}/common/drivers/pointProcmodule"
          test -d "$KDIR"
          test -f "$MDIR/Makefile"

          if [ -n "${CLANG_PATH:-}" ] && [ ! -x "${CLANG_PATH}" ]; then
            export CLANG_PATH="$(command -v clang)"
          fi
          export ARCH=arm64
          export LLVM=1
          export CC=clang

          if [ -x "$KDIR/scripts/config" ] && [ -f "$KDIR/.config" ]; then
            "$KDIR/scripts/config" --file "$KDIR/.config" \
              -d MODULE_COMPRESS -d MODULE_COMPRESS_ALL \
              -d MODULE_COMPRESS_GZIP -d MODULE_COMPRESS_XZ -d MODULE_COMPRESS_ZSTD || true
          fi

          KVER=""
          if [ -f "$KDIR/include/config/kernel.release" ]; then
            KVER=$(tr -d ' \n' < "$KDIR/include/config/kernel.release")
          elif [ -f "$KDIR/include/generated/utsrelease.h" ]; then
            KVER=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$KDIR/include/generated/utsrelease.h" | head -n1)
          else
            KVER=$(make -s -C "$KDIR" ARCH=arm64 LLVM=1 kernelrelease || true)
          fi
          if [ -z "$KVER" ]; then
            KVER="unknown"
          fi
          KVER_SAFE=$(printf '%s' "$KVER" | tr '/ :' '---')
          echo "=== kernel.release: ${KVER} ==="
          echo "kver=${KVER_SAFE}" >> "$GITHUB_OUTPUT"

          # Optional in-tree line, same as original request. Local bazel does not need it.
          if [ -d "$SRC/common/drivers" ]; then
            DRIVER_MAKEFILE="$SRC/common/drivers/Makefile"
          elif [ -d "$SRC/drivers" ]; then
            DRIVER_MAKEFILE="$SRC/drivers/Makefile"
          else
            DRIVER_MAKEFILE=""
          fi
          if [ -n "$DRIVER_MAKEFILE" ] && [ -f "$DRIVER_MAKEFILE" ]; then
            sed -i '/obj-\$(CONFIG_KSU)[[:space:]]*+=[[:space:]]*kernelsu\//d' "$DRIVER_MAKEFILE"
            if ! grep -qE 'pointProcmodule/' "$DRIVER_MAKEFILE"; then
              sed -i -e '$a\' "$DRIVER_MAKEFILE"
              echo 'obj-m += pointProcmodule/' >> "$DRIVER_MAKEFILE"
            fi
            tail -n 8 "$DRIVER_MAKEFILE"
          fi

          echo "=== make -C $KDIR M=$MDIR modules ==="
          make -C "$KDIR" M="$MDIR" ARCH=arm64 LLVM=1 CC=clang modules

          echo "=== module dir ==="
          ls -la "$MDIR"

          OUT_DIR="$GITHUB_WORKSPACE/out/aarch64"
          mkdir -p "$OUT_DIR"
          {
            echo "kmi=${KMI}"
            echo "ddk_release=${{ inputs.ddk_release }}"
            echo "kernel.release=${KVER}"
            echo "M=${MDIR}"
          } > "$OUT_DIR/KERNEL_VERSION.txt"

          found=0
          while IFS= read -r -d '' ko; do
            found=1
            case "$ko" in
              *.ko.gz) gzip -dc "$ko" > "${ko%.gz}"; ko="${ko%.gz}" ;;
              *.ko.xz) xz -dc "$ko" > "${ko%.xz}"; ko="${ko%.xz}" ;;
              *.ko.zst) zstd -dc "$ko" > "${ko%.zst}"; ko="${ko%.zst}" ;;
            esac
            base=$(basename "$ko" .ko)
            vermagic=""
            if command -v modinfo >/dev/null 2>&1; then
              vermagic=$(modinfo -F vermagic "$ko" 2>/dev/null || true)
            fi
            if [ -n "$vermagic" ]; then
              echo "vermagic ${base}: ${vermagic}" | tee -a "$OUT_DIR/KERNEL_VERSION.txt"
              ko_kver=$(printf '%s' "$vermagic" | awk '{print $1}')
            else
              ko_kver="$KVER_SAFE"
            fi
            ko_kver_safe=$(printf '%s' "$ko_kver" | tr '/ :' '---')
            dest="$OUT_DIR/${KMI}_${ko_kver_safe}_${base}.ko"
            dest_strip="$OUT_DIR/${KMI}_${ko_kver_safe}_${base}.stripped.ko"
            cp "$ko" "$dest"
            cp "$ko" "$dest_strip"
            llvm-strip -d "$dest_strip" || true
            echo "Copied unstripped $dest $(du -h "$dest" | cut -f1)"
            echo "Copied stripped   $dest_strip $(du -h "$dest_strip" | cut -f1)"
          done < <(find "$MDIR" -type f \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "[ERROR] no .ko produced"
            find "$MDIR" -maxdepth 2 -type f | head -80
            exit 1
          fi
          cat "$OUT_DIR/KERNEL_VERSION.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-${{ inputs.kmi }}_${{ steps.build.outputs.kver }}
          path: out/aarch64/
