name: ShellCheck

# DISABLED_BY_POINTPROC: replaced by build-pointproc-6.1.yml
on:
  workflow_dispatch:

jobs:
  shellcheck:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_names: gradlew
          ignore_paths: ./userspace/ksud/src/installer.sh ./.github/scripts/setup-rust-build.sh
