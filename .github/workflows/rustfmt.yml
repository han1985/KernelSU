name: Rustfmt check

# DISABLED_BY_POINTPROC: replaced by build-pointproc-6.1.yml
on:
  workflow_dispatch:

jobs:
  format:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check
