name: KennelPonit-6.6.x

# Same KMI/image as original KernelSU .github/workflows/build-lkm.yml + ddk-lkm.yml:
#   android15-6.6  ->  ghcr.io/ylarod/ddk-min:android15-6.6-20260828
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android15-6.6
    uses: ./.github/workflows/kennelponit-build.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: "20260828"
