name: test.1

# Fast smoke test: fetch private pointProcmodule with MYPOINT.
# Fine-grained PATs with Contents: Read cannot git clone over HTTPS
# (GitHub returns 403 "Write access to repository not granted").
# The Contents API tarball works with Read.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-pointprocmodule:
    name: test.1
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private pointProcmodule
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty."
            exit 1
          fi
          mkdir -p pointProcmodule
          code=$(curl -sS -o /tmp/pointproc.tgz -w "%{http_code}" \
            -H "Authorization: Bearer ${MYPOINT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -L "https://api.github.com/repos/han1985/pointProcmodule/tarball")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Failed to fetch tarball (HTTP ${code})."
            echo "Fine-grained PAT needs Contents: Read on han1985/pointProcmodule."
            head -c 500 /tmp/pointproc.tgz || true
            echo
            exit 1
          fi
          tar -xzf /tmp/pointproc.tgz --strip-components=1 -C pointProcmodule
          echo "=== fetch ok ==="
          ls -la pointProcmodule
