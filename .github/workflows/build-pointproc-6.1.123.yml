name: test.1

# Fast smoke test: fetch private pointProcmodule with MYPOINT.
# Fine-grained PAT that can GET /repos but not git-clone is missing Contents.
# Set Contents to "Read and write" on that token (same MYPOINT value is fine).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-pointprocmodule:
    name: test.1
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private pointProcmodule
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty."
            exit 1
          fi

          auth() {
            curl -sS -H "Authorization: Bearer ${MYPOINT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          echo "=== token identity ==="
          auth https://api.github.com/user | python3 -c 'import json,sys; d=json.load(sys.stdin); print("login:", d.get("login", d.get("message", d)))'

          echo "=== repo metadata ==="
          repo_code=$(auth -o /tmp/repo.json -w "%{http_code}" \
            https://api.github.com/repos/han1985/pointProcmodule)
          echo "GET /repos -> HTTP ${repo_code}"

          echo "=== contents permission ==="
          contents_code=$(auth -o /tmp/contents.json -w "%{http_code}" \
            https://api.github.com/repos/han1985/pointProcmodule/contents/)
          echo "GET /contents -> HTTP ${contents_code}"
          python3 -c 'import json; d=json.load(open("/tmp/contents.json")); print(d if isinstance(d, dict) and "message" in d else "contents list ok, entries: %s" % (len(d) if isinstance(d, list) else type(d).__name__))'

          if [ "$contents_code" != "200" ]; then
            echo "::error::PAT has no Contents permission on han1985/pointProcmodule."
            echo "Edit the Fine-grained token: Repository permissions -> Contents -> Read and write."
            echo "Repository access must include pointProcmodule. Saving permissions is enough; keep the same MYPOINT secret."
            echo "Or replace MYPOINT with a Classic token that has the repo scope."
            exit 1
          fi

          echo "=== git clone ==="
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            pointProcmodule
          echo "=== clone ok ==="
          git -C pointProcmodule log -1 --oneline
          ls -la pointProcmodule
