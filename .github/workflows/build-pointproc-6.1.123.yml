name: Test clone pointProcmodule

# Fast smoke test: only fetch the private repo with secret MYPOINT.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-pointprocmodule:
    name: Clone han1985/pointProcmodule
    runs-on: ubuntu-latest
    steps:
      - name: Clone private pointProcmodule
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            pointProcmodule
          echo "=== clone ok ==="
          git -C pointProcmodule log -1 --oneline
          ls -la pointProcmodule
