name: test.1

# Fast smoke test: fetch private pointProcmodule with MYPOINT.
# Use a Classic PAT with the `repo` scope. Fine-grained tokens often return
# 403 "Resource not accessible by personal access token" on archive/git APIs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-pointprocmodule:
    name: test.1
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private pointProcmodule
        env:
          MYPOINT: ${{ secrets.MYPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${MYPOINT:-}" ]; then
            echo "::error::Secret MYPOINT is empty."
            exit 1
          fi

          auth() {
            curl -sS -H "Authorization: Bearer ${MYPOINT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          echo "=== token identity ==="
          auth https://api.github.com/user | python3 -c 'import json,sys; d=json.load(sys.stdin); print("login:", d.get("login", d.get("message", d)))'

          echo "=== repo API ==="
          repo_code=$(auth -o /tmp/repo.json -w "%{http_code}" \
            https://api.github.com/repos/han1985/pointProcmodule)
          echo "GET /repos/han1985/pointProcmodule -> HTTP ${repo_code}"
          python3 -c 'import json; d=json.load(open("/tmp/repo.json")); print("full_name:", d.get("full_name")); print("private:", d.get("private")); print("message:", d.get("message",""))'

          echo "=== git clone ==="
          if git clone --depth 1 \
            "https://x-access-token:${MYPOINT}@github.com/han1985/pointProcmodule.git" \
            pointProcmodule; then
            echo "=== clone ok ==="
            git -C pointProcmodule log -1 --oneline
            ls -la pointProcmodule
            exit 0
          fi

          echo "::error::Clone failed. Put a Classic PAT (scope: repo) into KernelSU secret MYPOINT."
          echo "Fine-grained tokens need Contents: Read and write on pointProcmodule, and often still fail."
          exit 1
