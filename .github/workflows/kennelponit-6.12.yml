name: KennelPonit-6.12.x

# Official android16-6.12 monthly GKI small versions:
#   6.12.92 / 6.12.81 / 6.12.69 / 6.12.58 / 6.12.38
# Layout matches local: common/drivers/pointProcmodule
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gki_branch: android16-6.12-2026-09
            kver: "6.12.92"
          - gki_branch: android16-6.12-2026-06
            kver: "6.12.81"
          - gki_branch: android16-6.12-2026-03
            kver: "6.12.69"
          - gki_branch: android16-6.12-2025-12
            kver: "6.12.58"
          - gki_branch: android16-6.12-2025-09
            kver: "6.12.38"
    uses: ./.github/workflows/kennelponit-gki-build.yml
    secrets: inherit
    with:
      kmi: android16-6.12
      gki_branch: ${{ matrix.gki_branch }}
      ddk_release: "20260828"
