name: KennelPonit-6.12.x

# Official Android GKI android16-6.12 monthly lines (not DDK's single KMI image).
# Source: https://source.android.com/docs/core/architecture/kernel/gki-android16-6_12-release-builds
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gki_branch: android16-6.12-2026-09
            kver: "6.12.92"
          - gki_branch: android16-6.12-2026-06
            kver: "6.12.81"
          - gki_branch: android16-6.12-2026-03
            kver: "6.12.69"
          - gki_branch: android16-6.12-2025-12
            kver: "6.12.58"
          - gki_branch: android16-6.12-2025-09
            kver: "6.12.38"
    uses: ./.github/workflows/kennelponit-gki-build.yml
    secrets: inherit
    with:
      kmi: android16-6.12
      gki_branch: ${{ matrix.gki_branch }}
      ddk_release: "20260828"
