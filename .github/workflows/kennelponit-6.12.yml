name: KennelPonit-6.12.x

# Same KMI/image as original KernelSU .github/workflows/build-lkm.yml + ddk-lkm.yml:
#   android16-6.12  ->  ghcr.io/ylarod/ddk-min:android16-6.12-20260828
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android16-6.12
    uses: ./.github/workflows/kennelponit-build.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: "20260828"
