name: KennelPonit-6.12.x

# Same as local:
#   /media/vm/AOSP/com6.12.x/common/drivers/<module>
#   tools/bazel build //common/drivers/hwBreakpointProc_module:qcomdc
# Bazel KERNEL_SRC == DDK /opt/ddk/kdir/android16-6.12
#   make -C $KDIR M=common/drivers/pointProcmodule modules
# Manual only.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android16-6.12
    uses: ./.github/workflows/kennelponit-build.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: "20260828"
